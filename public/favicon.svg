<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>

  <!-- QR style blocks -->
  <rect x="10" y="10" width="16" height="16" fill="#000"/>
  <rect x="14" y="14" width="8" height="8" fill="#fff"/>

  <rect x="38" y="10" width="16" height="16" fill="#000"/>
  <rect x="42" y="14" width="8" height="8" fill="#fff"/>

  <rect x="10" y="38" width="16" height="16" fill="#000"/>
  <rect x="14" y="42" width="8" height="8" fill="#fff"/>

  <!-- QR random pixels -->
  <rect x="30" y="28" width="4" height="4" fill="#000"/>
  <rect x="34" y="32" width="4" height="4" fill="#000"/>
  <rect x="26" y="34" width="4" height="4" fill="#000"/>

  <!-- Speech bubble -->
  <path d="M36 36
           q10 0 10 8
           q0 8 -10 8
           h-8
           l-6 4
           l2-4
           h-2
           q-8 0 -8 -8
           q0 -8 8 -8
           z"
        fill="#4285F4"/>

  <!-- Stars -->
  <circle cx="26" cy="44" r="2" fill="#34A853"/>
  <circle cx="32" cy="44" r="2" fill="#FBBC05"/>
  <circle cx="38" cy="44" r="2" fill="#EA4335"/>
</svg>
